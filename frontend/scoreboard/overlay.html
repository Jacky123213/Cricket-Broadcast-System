<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backyard Scoreboard · Overlay</title><link rel="stylesheet" href="/style.css?v=0.3.2"><link rel="stylesheet" href="/scoreboard-assets/graphics.css?v=0.3.2"></head>
<body class="overlay-body"><div id="connection" class="overlay-status">WAITING FOR SCORE</div>
<section id="scorebar" class="scorebar" aria-label="Cricket scoreboard"><div class="team-block"><div><b id="team1">HOME</b><img id="logo1" alt="Batting team logo" hidden></div><div><strong id="total">—</strong><span>OVERS <b id="overs">—</b></span></div></div><div class="middle"><div class="batters"><div id="batter1" class="batter"><b id="batter1_name">BATTER 1</b><span><strong id="batter1_runs">—</strong> <small id="batter1_balls">—</small></span></div><div id="batter2" class="batter"><b id="batter2_name">BATTER 2</b><span><strong id="batter2_runs">—</strong> <small id="batter2_balls">—</small></span></div></div><div id="banner" class="ticker" aria-live="polite"><span id="bannerText">BACKYARD CRICKET</span></div></div><div class="bowling"><b id="bowler">BOWLER</b><div><strong id="bowler_figures">—</strong> <span id="bowler_overs"></span></div><small id="overLabel" class="over-label">THIS OVER</small><div id="deliveries" class="balls"></div></div><div class="opposition"><b id="team2">AWAY</b><img id="logo2" alt="Bowling team logo" hidden></div></section>
<section id="statGraphic" class="stat-graphic" aria-label="Match statistics" hidden></section>
<aside id="breakGraphic" class="break-graphic" aria-label="Innings break" hidden></aside>
<script src="/scoreboard-assets/graphic-renderer.js?v=0.3.2"></script><script src="/overlay.js?v=0.3.2"></script>
</body></html>
